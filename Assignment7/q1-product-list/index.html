<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Product List Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; }
    button { padding: 6px 12px; margin: 2px; cursor: pointer; }
    input, textarea { padding: 6px; box-sizing: border-box; }
    ul { padding: 0; list-style: none; }
    li { padding: 6px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 6px; }
    li span, li input { flex: 1; }
  </style>
</head>
<body>
  <h2>Q1 - Product List Manager</h2>
  <input type="text" id="productInput" placeholder="New product">
  <button id="addBtn">Add</button>
  <ul id="productList"></ul>
  <script src="script.js"></script>
</body>
</html>
