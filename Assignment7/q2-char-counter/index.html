<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Live Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; }
    button { padding: 6px 12px; margin: 2px; cursor: pointer; }
    input, textarea { padding: 6px; box-sizing: border-box; }
    textarea { width: 100%; height: 120px; }
    #counter { font-weight: bold; color: green; }
    #counter.warning { color: goldenrod; }
    #counter.danger { color: red; }
  </style>
</head>
<body>
  <h2>Q2 - Live Character Counter</h2>
  <textarea id="message" placeholder="Type here (max 100 characters)"></textarea>
  <p>Remaining: <span id="counter">100</span></p>
  <button id="resetBtn">Reset</button>
  <script src="script.js"></script>
</body>
</html>
