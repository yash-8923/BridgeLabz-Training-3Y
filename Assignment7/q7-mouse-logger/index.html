<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 - Mouse Path Logger</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; }
    button { padding: 6px 12px; margin: 2px; cursor: pointer; }
    input, textarea { padding: 6px; box-sizing: border-box; }
    #box { position: relative; width: 400px; height: 400px; border: 2px solid #333; background: #fafafa; }
    .dot { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>
  <h2>Q7 - Mouse Path Logger</h2>
  <p id="coords">Move the mouse inside the box. Double-click to drop a dot.</p>
  <div id="box"></div>
  <script src="script.js"></script>
</body>
</html>
