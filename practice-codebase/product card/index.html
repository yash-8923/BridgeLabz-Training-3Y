<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
/
  <div class="card">

    <img
  src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
  alt="Running Shoes"
  class="product-image"
>

    <div class="discount">20% OFF</div>

    <div class="heart">♡</div>

    <div class="content">

      <div class="category">SPORTS SHOES</div>

      <div class="title">Premium Running Shoes</div>

      <div class="rating">
        ★★★★★
        <span>(120)</span>
      </div>

      <div class="price">
        ₹1,999
        <del>₹2,499</del>
      </div>

      <button class="cart-btn">Add to Cart</button>

    </div>

  </div>

</body>
</html>
