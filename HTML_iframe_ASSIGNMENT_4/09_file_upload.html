<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>
    <!-- The accept attribute restricts the file chooser to JPG and PNG files. -->
    <h1>File Upload</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose an image:</label>
        <input type="file" id="image-file" name="image_file" accept=".jpg,.png">
        <br><br>
        <p>Allowed files: JPG and PNG image files only.</p>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
