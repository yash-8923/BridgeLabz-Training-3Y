<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>
    <!-- This iframe embeds a YouTube video. -->
    <h1>YouTube Video</h1>
    <!-- Percentage values make the iframe adjust when the browser is resized. -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video" width="100%" height="50%"></iframe>
</body>
</html>
