<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>
    <!-- This form collects written feedback and a rating. -->
    <h1>Feedback</h1>
    <form method="post" action="#">
        <label for="feedback">Feedback:</label>
        <br>
        <textarea id="feedback" name="feedback" rows="6" cols="40"></textarea>
        <br><br>
        <p>Rating:</p>
        <label><input type="radio" name="rating" value="Good"> Good</label>
        <label><input type="radio" name="rating" value="Average"> Average</label>
        <label><input type="radio" name="rating" value="Poor"> Poor</label>
        <br><br>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
