<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Iframes</title>
</head>
<body>
    <!-- The first iframe displays an introduction page. -->
    <h1>Introduction</h1>
    <iframe srcdoc="<!DOCTYPE html><html><body><h2>My Introduction</h2><p>Hello! My name is Yash. Welcome to my introduction page.</p></body></html>" title="Introduction" width="100%" height="180"></iframe>

    <!-- The second iframe displays a favorite hobby page. -->
    <h1>Favorite Hobby</h1>
    <iframe srcdoc="<!DOCTYPE html><html><body><h2>My Favorite Hobby</h2><p>My favorite hobby is listening to music and exploring new ideas.</p></body></html>" title="Favorite hobby" width="100%" height="180"></iframe>
</body>
</html>
