<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <!-- This iframe displays a Google Map. -->
    <h1>My City Map</h1>
    <!-- loading="lazy" delays loading the iframe until it is close to the viewport. -->
    <iframe src="https://www.google.com/maps?q=Lucknow%2C%20India&output=embed" title="Google Map of Lucknow" width="100%" height="450" loading="lazy"></iframe>
</body>
</html>
