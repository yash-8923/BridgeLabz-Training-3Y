<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile Card</title>
<link rel="stylesheet" href="card.css">
</head>
<body>

  <div class="card">
    <div class="avatar">Student</div>
    <h1 class="name">Rahul Sharma</h1>
    <p class="major">Computer Science Engineering</p>
    <p class="institute">ABC Institute of Technology</p>
    <p class="bio">
      I am a passionate Computer Science student interested in
      Web Development, Java, and problem solving.
    </p>
    <h2 class="skills-title">Skills</h2>
    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">Java</span>
      <span class="skill">Problem Solving</span>
    </div>
    <button class="contact-btn">Contact Me</button>
  </div>

</body>
</html>
