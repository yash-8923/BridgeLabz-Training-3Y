<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Positioning</h1>

    <div class="box static-box">Static (default)</div>

    <div class="container">
        <div class="box relative-box">Relative</div>
    </div>

    <div class="container">
        <div class="box absolute-box">Absolute</div>
    </div>

    <div class="box fixed-box">Fixed</div>

    <p>Scroll down to see the fixed box stay in place.</p>
    <p style="margin-top: 800px;">End of page.</p>

</body>
</html>
