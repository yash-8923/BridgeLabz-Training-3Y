<!DOCTYPE html><html><head><title>Typography</title><link rel="stylesheet" href="style.css"></head><body><article><h1>Good Typography</h1><p>Typography makes a page easy to read. <mark>Important words</mark> should stand out, while <strong>strong text</strong> and <em>emphasized text</em> add meaning.</p><p>Using different fonts, weights and sizes helps create a clear visual order.</p></article></body></html>
