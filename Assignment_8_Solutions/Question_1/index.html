<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Pseudo-Classes</h1></header>
<main class="examples">
  <section><a href="#">Hover me</a><p>:hover changes style when the mouse is over it.</p></section>
  <section><button>Focus me</button><p>:focus styles an active form control.</p></section>
  <section><button class="active">Press me</button><p>:active works while an element is being clicked.</p></section>
  <section><ul><li>First</li><li>Second</li><li>Third</li></ul><p>:nth-child() selects an item by its position.</p></section>
</main>
</body>
</html>
