<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Q3 - Task Manager</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 15px;background:#f5f6fa;color:#222}
h1{font-size:22px}
input,select,button{padding:8px;font-size:15px;border:1px solid #bbb;border-radius:4px}
button{background:#2d6cdf;color:#fff;border:none;cursor:pointer}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:12px}
.error{color:#c0392b;font-weight:bold}.warn{background:#fff3cd;border:1px solid #e0c200;padding:10px;border-radius:4px;margin:10px 0}
.muted{color:#777}
</style>
<style>.done{text-decoration:line-through;color:#888}</style>
</head><body>
<h1>Q3. Task Manager With Filters</h1>
<label for="filter">Show: </label>
<select id="filter">
  <option value="all">All Tasks</option>
  <option value="Low">Low Priority</option>
  <option value="Medium">Medium Priority</option>
  <option value="High">High Priority</option>
  <option value="completed">Completed</option>
</select>
<p id="message" class="error"></p>
<ul id="taskList" style="list-style:none;padding:0"></ul>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body></html>
