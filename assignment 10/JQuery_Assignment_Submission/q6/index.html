<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Q6 - Registration</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 15px;background:#f5f6fa;color:#222}
h1{font-size:22px}
input,select,button{padding:8px;font-size:15px;border:1px solid #bbb;border-radius:4px}
button{background:#2d6cdf;color:#fff;border:none;cursor:pointer}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:12px}
.error{color:#c0392b;font-weight:bold}.warn{background:#fff3cd;border:1px solid #e0c200;padding:10px;border-radius:4px;margin:10px 0}
.muted{color:#777}
</style>
<style>input{width:100%;box-sizing:border-box;margin:6px 0 12px}</style>
</head><body>
<h1>Q6. User Registration</h1>
<div id="registerForm">
  <label>Name</label><input type="text" id="name">
  <label>Email</label><input type="email" id="email">
  <label>Password</label><input type="password" id="password">
  <button id="submitBtn">Register</button>
</div>
<p id="message"></p>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
<script src="script.js"></script>
</body></html>
