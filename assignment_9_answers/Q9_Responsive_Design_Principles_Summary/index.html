<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Principles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Responsive Design Principles</h1>
        <section class="principles">
            <article><h2>Fluid Layouts</h2><p>Layouts use flexible sizes so content can adjust to the screen.</p><code>width: 100%;</code></article>
            <article><h2>Flexible Media</h2><p>Images can resize inside their containers.</p><code>max-width: 100%;</code></article>
            <article><h2>Breakpoints</h2><p>Media queries change the layout at selected screen sizes.</p><code>@media (max-width: 600px)</code></article>
        </section>
    </main>
</body>
</html>
