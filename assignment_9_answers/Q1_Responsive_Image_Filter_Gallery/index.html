<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>
    <main class="gallery">
        <figure><img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain"><figcaption>Blur</figcaption></figure>
        <figure><img class="gray" src="https://picsum.photos/id/1025/500/350" alt="Dog"><figcaption>Grayscale</figcaption></figure>
        <figure><img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="River"><figcaption>Sepia</figcaption></figure>
        <figure><img class="bright" src="https://picsum.photos/id/1043/500/350" alt="Forest"><figcaption>Brightness</figcaption></figure>
        <figure><img class="contrast" src="https://picsum.photos/id/1069/500/350" alt="Road"><figcaption>Contrast</figcaption></figure>
        <figure><img class="hue" src="https://picsum.photos/id/1074/500/350" alt="Nature"><figcaption>Hue Rotate</figcaption></figure>
    </main>
    <footer>Responsive CSS Gallery</footer>
</body>
</html>
