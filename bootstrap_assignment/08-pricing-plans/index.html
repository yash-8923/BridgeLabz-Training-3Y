<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="text-center mb-5">
      <h1>Choose Your Plan</h1>
      <p>Pick a plan that works for your team.</p>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-sm plan-card">
          <div class="card-body text-center">
            <h2>Basic</h2>
            <h3>$9 <small>/month</small></h3>
            <ul class="list-unstyled my-4">
              <li>5 Projects</li><li>1 GB Storage</li><li>Email Support</li>
            </ul>
            <button class="btn btn-outline-primary">Choose Plan</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 bg-primary text-white shadow-lg plan-card">
          <div class="card-body text-center">
            <h2>Pro</h2>
            <h3>$19 <small>/month</small></h3>
            <ul class="list-unstyled my-4">
              <li>Unlimited Projects</li><li>20 GB Storage</li><li>Priority Support</li>
            </ul>
            <button class="btn btn-light">Choose Plan</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm plan-card">
          <div class="card-body text-center">
            <h2>Team</h2>
            <h3>$39 <small>/month</small></h3>
            <ul class="list-unstyled my-4">
              <li>Team Members</li><li>100 GB Storage</li><li>Priority Support</li>
            </ul>
            <button class="btn btn-outline-primary">Choose Plan</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
