<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="mb-4">Notifications</h1>
        <div class="alert alert-success">You have 3 new messages.</div>
        <div class="alert alert-info">Your profile is almost complete.</div>
        <div class="alert alert-danger">Your password will expire soon.</div>
        <div class="alert alert-warning alert-dismissible fade show">
          New login detected from a new device.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <section class="bg-light border rounded p-4 mt-4">
          <h2 class="h4">Summary</h2>
          <p class="mb-0">You have 4 notifications and 2 pending actions.</p>
        </section>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
