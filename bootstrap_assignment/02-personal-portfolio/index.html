<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
  <header class="text-center p-5">
    <div class="container">
      <h1 class="fw-bold">Yash Agrawal</h1>
      <p class="lead">Computer Science Student & Developer</p>
    </div>
  </header>

  <main>
    <section class="container text-center mb-5">
      <img src="https://i.pravatar.cc/250?img=12" class="img-fluid rounded-circle profile-img mb-3" alt="Profile">
      <h2>About Me</h2>
      <p>I enjoy building simple websites and learning new technologies.</p>
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark">Download CV</a>
    </section>

    <section class="container mb-5">
      <h2 class="text-center mb-3">Contact Me</h2>
      <form class="mx-auto contact-form">
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Your Email">
        <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
        <button class="btn btn-dark w-100">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
