<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bg-dark text-white text-center py-4">
    <h1>Tech Store</h1>
    <p class="mb-0">Simple products for everyday work</p>
  </header>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3"><div class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Laptop"><div class="card-body"><h5>Laptop</h5><p>$699</p><button class="btn btn-primary">Add to Cart</button></div></div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Watch"><div class="card-body"><h5>Smart Watch</h5><p>$129</p><button class="btn btn-primary">Add to Cart</button></div></div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Headphones"><div class="card-body"><h5>Headphones</h5><p>$89</p><button class="btn btn-primary">Add to Cart</button></div></div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Keyboard"><div class="card-body"><h5>Keyboard</h5><p>$59</p><button class="btn btn-primary">Add to Cart</button></div></div></div>
    </div>
  </main>
</body>
</html>
