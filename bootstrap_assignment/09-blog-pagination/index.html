<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-4">My Blog</h1>

    <div class="row g-4 mb-5">
      <div class="col-md-6"><article class="border rounded p-4"><h2>Learning Bootstrap</h2><p>Bootstrap makes responsive layouts easier to build.</p></article></div>
      <div class="col-md-6"><article class="border rounded p-4"><h2>My Coding Journey</h2><p>Practice and small projects help build better coding habits.</p></article></div>
    </div>

    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-outline-secondary">Older Posts</button>
      <button class="btn btn-outline-secondary">Newer Posts</button>
    </div>
  </main>
</body>
</html>
