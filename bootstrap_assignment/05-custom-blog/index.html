<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="mb-0">Daily Notes</h1>
      <span>Ideas & Stories</span>
    </div>
  </header>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-md-6">
        <article class="card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Writing">
          <div class="card-body">
            <h2 class="h4">How to Stay Productive</h2>
            <p>Small habits can make your daily work more focused and simple.</p>
            <button class="btn btn-primary">Read More</button>
          </div>
        </article>
      </div>
      <div class="col-md-6">
        <article class="card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Notebook">
          <div class="card-body">
            <h2 class="h4">Learning New Skills</h2>
            <p>Learning a little every day is a useful way to improve your skills.</p>
            <button class="btn btn-primary">Read More</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="text-center py-4">
    <p class="mb-0">© 2026 Daily Notes</p>
  </footer>
</body>
</html>
