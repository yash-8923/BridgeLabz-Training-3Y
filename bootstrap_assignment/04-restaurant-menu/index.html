<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="text-center py-5 bg-dark text-white">
    <h1>Spice Garden</h1>
    <p class="lead mb-0">Today's Menu</p>
  </header>

  <main class="container py-5">
    <section class="mb-5">
      <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=80" class="img-fluid rounded food-img" alt="Food">
      <p class="text-center mt-2">Fresh food made with simple ingredients.</p>
    </section>

    <section class="mb-5">
      <h2 class="text-center mb-4">Menu</h2>
      <div class="table-responsive">
        <table class="table table-striped text-center">
          <thead class="table-dark"><tr><th>Item</th><th>Category</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td>Paneer Tikka</td><td>Starter</td><td>₹180</td></tr>
            <tr><td>Veg Biryani</td><td>Main Course</td><td>₹220</td></tr>
            <tr><td>Dal Tadka</td><td>Main Course</td><td>₹160</td></tr>
            <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹90</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Chef's Specials</h2>
      <ul class="list-group">
        <li class="list-group-item">Special Butter Paneer</li>
        <li class="list-group-item">Tandoori Platter</li>
        <li class="list-group-item">Mango Lassi</li>
      </ul>
    </section>
  </main>
</body>
</html>
