<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="text-center py-4 bg-dark text-white">
    <h1>Explore World</h1>
    <p class="mb-0">Plan your next trip with us</p>
  </header>

  <main>
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Paris">
          <div class="carousel-caption"><h2>Paris</h2><p>Enjoy the city of lights.</p></div>
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Thailand">
          <div class="carousel-caption"><h2>Thailand</h2><p>Relax on beautiful beaches.</p></div>
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Bali">
          <div class="carousel-caption"><h2>Bali</h2><p>Discover nature and culture.</p></div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <section class="container py-5">
      <h2>Booking Progress</h2>
      <div class="progress mt-3">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%">70%</div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">Contact: hello@exploreworld.com | +91 98765 43210</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
