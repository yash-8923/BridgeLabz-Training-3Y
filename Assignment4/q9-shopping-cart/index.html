<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Shopping Cart</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; }
    input { display: block; width: 100%; padding: 6px; margin: 4px 0; box-sizing: border-box; border: 2px solid #ccc; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; }
    button { padding: 7px 14px; margin-top: 8px; }
    pre { background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>
  <h2>Q9 - Shopping Cart</h2>
  <form id="itemForm">
    <input type="text" id="itemName" placeholder="Item name" required>
    <input type="number" id="itemPrice" placeholder="Price" min="0" required>
    <input type="number" id="itemQty" placeholder="Quantity" min="1" required>
    <button type="submit">Add Item</button>
  </form>
  <ul id="cartList"></ul>
  <input type="text" id="coupon" placeholder="Coupon (SAVE20 or DISC10)">
  <button id="applyBtn">Apply Coupon</button>
  <p id="couponMessage"></p>
  <h3 id="total">Total: 0</h3>
  <script src="script.js"></script>
</body>
</html>
