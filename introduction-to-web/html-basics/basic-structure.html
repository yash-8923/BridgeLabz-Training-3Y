<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic HTML Structure</title>
</head>
<body>

    <h1>This is a Basic HTML Page</h1>

    <p>Every HTML page starts with a DOCTYPE, then an html tag with a head and a body.</p>

    <p>The head contains information about the page, like the title.</p>

    <p>The body contains everything that shows up on the page.</p>

</body>
</html>
