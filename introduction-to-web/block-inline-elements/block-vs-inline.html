<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block vs Inline Elements</title>
</head>
<body>

    <h1>Block vs Inline Elements</h1>

    <h2>Block Elements</h2>

    <div style="background-color: lightblue;">This is a div. It takes up the full width.</div>
    <div style="background-color: lightgreen;">This is another div, on a new line.</div>

    <p>A paragraph is also a block element.</p>

    <h2>Inline Elements</h2>

    <p>
        <span style="background-color: yellow;">This is a span.</span>
        <span style="background-color: orange;">This is another span.</span>
        They stay on the same line because span is inline.
    </p>

</body>
</html>
