<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Entities and URI Demo</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>Less than sign: &lt;</p>
    <p>Greater than sign: &gt;</p>
    <p>Ampersand sign: &amp;</p>
    <p>Copyright sign: &copy;</p>
    <p>Non breaking space between these two words: word1&nbsp;word2</p>

    <h1>URI Example</h1>

    <p>A link with spaces encoded in the URL:</p>
    <a href="https://www.google.com/search?q=html%20entities">Search HTML entities on Google</a>

</body>
</html>
