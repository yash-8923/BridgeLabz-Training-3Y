<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Async Coffee Maker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; color: #222; }
    h1 { color: #203864; }
    .note { background: white; padding: 15px; border-radius: 8px; }
    #products { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    .product-card { background: white; padding: 15px; border-radius: 8px; }
    .product-card img { width: 100%; height: 150px; object-fit: contain; }
    .product-card h3 { font-size: 14px; }
  </style>
</head>
<body>
  <h1>Q1. Async Coffee Maker</h1>
  <div class="note">
    <p>Open the browser developer console (F12 → Console) to see the output.</p>
    <p id="status"></p>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
